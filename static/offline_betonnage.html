<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saisie Hors-Ligne - Bétonnage</title>
  <style>
    :root {
      --primary-color: #0066cc;
      --success-color: #28a745;
      --danger-color: #dc3545;
      --warning-color: #ffc107;
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      margin: 0;
      padding: 15px;
      color: #333;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      color: var(--primary-color);
      margin-top: 0;
    }

    .status-bar {
      padding: 10px;
      border-radius: 5px;
      text-align: center;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .online {
      background-color: #d4edda;
      color: #155724;
    }

    .offline {
      background-color: #f8d7da;
      color: #721c24;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
      font-size: 0.9em;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 1em;
    }

    .row {
      display: flex;
      gap: 10px;
    }

    .row .form-group {
      flex: 1;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 4px;
      font-size: 1em;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn-submit {
      background-color: var(--primary-color);
      color: white;
    }

    .btn-sync {
      background-color: var(--success-color);
      color: white;
    }

    .list-section {
      margin-top: 30px;
      border-top: 2px solid #eee;
      padding-top: 15px;
    }

    .card-item {
      background: #f8f9fa;
      border-left: 4px solid var(--primary-color);
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 4px;
      font-size: 0.9em;
    }

    .card-item p {
      margin: 3px 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Saisie Suivi Bétonnage</h2>
    
    <div id="status-bar" class="status-bar offline">
      Mode Hors-Ligne (Données sauvegardées localement)
    </div>

    <form id="form-betonnage">
      <div class="form-group">
        <label for="f_ouvrage">Ouvrage / Structure</label>
        <input type="text" id="f_ouvrage" placeholder="Ex: PRO 0636, PRA 0500..." required>
      </div>

      <div class="row">
        <div class="form-group">
          <label for="f_date">Date</label>
          <input type="date" id="f_date" required>
        </div>
        <div class="form-group">
          <label for="f_volume">Volume (m³)</label>
          <input type="number" step="0.1" id="f_volume" placeholder="0.0" required>
        </div>
      </div>

      <div class="row">
        <div class="form-group">
          <label for="f_heure_debut">Heure Début</label>
          <input type="time" id="f_heure_debut" onchange="majDuree()" required>
        </div>
        <div class="form-group">
          <label for="f_heure_fin">Heure Fin</label>
          <input type="time" id="f_heure_fin" onchange="majDuree()" required>
        </div>
      </div>

      <div class="form-group">
        <label for="f_duree">Durée Estimée (min)</label>
        <input type="number" id="f_duree" readonly placeholder="Calcul automatique">
      </div>

      <div class="form-group">
        <label for="f_remarques">Remarques / Observations</label>
        <textarea id="f_remarques" rows="3" placeholder="Condition météo, incidents..."></textarea>
      </div>

      <button type="submit" class="btn-submit">Sauvegarder Localement</button>
    </form>

    <div class="list-section">
      <h3>Saisies en attente de synchro (<span id="count-attente">0</span>)</h3>
      <button id="btn-sync" class="btn-sync" onclick="synchroniser()">Synchroniser les données</button>
      <div id="liste-attente" style="margin-top: 15px;"></div>
    </div>
  </div>

  <script>
    const DB_NAME = "SmartBetonDB";
    const STORE_NAME = "saisies_beton";

    // Initialisation d'IndexedDB
    function ouvrirBDD() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = (event) => {
          const db = event.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME, { keyPath: "id", autoIncrement: true });
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    // Gestion de l'état réseau
    function majBandeauReseau() {
      const statusBar = document.getElementById("status-bar");
      if (navigator.onLine) {
        statusBar.textContent = "Connecté (En ligne)";
        statusBar.className = "status-bar online";
      } else {
        statusBar.textContent = "Mode Hors-Ligne (Stockage local)";
        statusBar.className = "status-bar offline";
      }
    }

    window.addEventListener("online", majBandeauReseau);
    window.addEventListener("offline", majBandeauReseau);

    // Calcul de la durée
    function majDuree() {
      const debut = document.getElementById("f_heure_debut").value;
      const fin = document.getElementById("f_heure_fin").value;
      if (debut && fin) {
        const [h1, m1] = debut.split(":").map(Number);
        const [h2, m2] = fin.split(":").map(Number);
        let diff = (h2 * 60 + m2) - (h1 * 60 + m1);
        if (diff < 0) diff += 1440; // Gestion passage de minuit
        document.getElementById("f_duree").value = diff;
      }
    }

    // Sauvegarde local dans IndexedDB
    document.getElementById("form-betonnage").addEventListener("submit", async (e) => {
      e.preventDefault();
      
      const donnee = {
        ouvrage: document.getElementById("f_ouvrage").value,
        date: document.getElementById("f_date").value,
        volume: parseFloat(document.getElementById("f_volume").value),
        heure_debut: document.getElementById("f_heure_debut").value,
        heure_fin: document.getElementById("f_heure_fin").value,
        duree: document.getElementById("f_duree").value,
        remarques: document.getElementById("f_remarques").value,
        horodatage: new Date().toISOString()
      };

      const db = await ouvrirBDD();
      const tx = db.transaction(STORE_NAME, "readwrite");
      tx.objectStore(STORE_NAME).add(donnee);
      
      tx.oncomplete = async () => {
        alert("Saisie enregistrée localement !");
        document.getElementById("form-betonnage").reset();
        document.getElementById("f_date").value = new Date().toISOString().slice(0, 10);
        await rafraichirListeAttente();
      };
    });

    // Afficher les éléments en attente
    async function rafraichirListeAttente() {
      const db = await ouvrirBDD();
      const tx = db.transaction(STORE_NAME, "readonly");
      const store = tx.objectStore(STORE_NAME);
      const req = store.getAll();

      req.onsuccess = () => {
        const items = req.result;
        document.getElementById("count-attente").textContent = items.length;
        const conteneur = document.getElementById("liste-attente");
        conteneur.innerHTML = "";

        items.forEach(item => {
          const card = document.createElement("div");
          card.className = "card-item";
          card.innerHTML = `
            <strong>${item.ouvrage}</strong> - ${item.date}<br>
            <small>Vol: ${item.volume} m³ | Durée: ${item.duree} min (${item.heure_debut} - ${item.heure_fin})</small>
            ${item.remarques ? `<br><small><em>${item.remarques}</em></small>` : ""}
          `;
          conteneur.appendChild(card);
        });
      };
    }

    // Synchronisation avec le serveur quand la connexion revient
    async function synchroniser() {
      if (!navigator.onLine) {
        alert("Vous êtes toujours hors-ligne.");
        return;
      }

      const db = await ouvrirBDD();
      const tx = db.transaction(STORE_NAME, "readonly");
      const store = tx.objectStore(STORE_NAME);
      const req = store.getAll();

      req.onsuccess = async () => {
        const items = req.result;
        if (items.length === 0) {
          alert("Aucune donnée en attente de synchronisation.");
          return;
        }

        try {
          // Remplacez l'URL ci-dessous par l'endpoint API Supabase/Streamlit
          const response = await fetch("/api/sync-betonnage", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(items)
          });

          if (response.ok) {
            // Vidage de la base locale après synchronisation réussie
            const clearTx = db.transaction(STORE_NAME, "readwrite");
            clearTx.objectStore(STORE_NAME).clear();
            clearTx.oncomplete = () => {
              alert("Synchronisation réussie !");
              rafraichirListeAttente();
            };
          } else {
            alert("Erreur lors de la synchronisation serveur.");
          }
        } catch (err) {
          console.error("Erreur Synchro :", err);
          alert("Échec de la connexion au serveur.");
        }
      };
    }

    // Initialisation au chargement de la page
    window.addEventListener("load", async () => {
      majBandeauReseau();
      document.getElementById("f_date").value = new Date().toISOString().slice(0, 10);
      await rafraichirListeAttente();

      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw-betonnage.js")
          .then((reg) => console.log("Service Worker (hors-ligne) enregistré", reg))
          .catch((err) => console.error("Erreur Service Worker :", err));
      }
    });
  </script>
</body>
</html>
